name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run regression tests
        run: python -m pytest -q tests --durations=10

      - name: Smoke-test process backend
        run: python tests/process_backend_smoke.py
