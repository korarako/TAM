schema_version: 2
release_version: 0.2.0
release_date: 2026-07-26

result_classes:
  accepted_hash_bound_legacy:
    - dw1d
    - dw2d
  corrected_single_seed_positive_pilot:
    - mb2d_reference_v2_seed0
  corrected_conditional_positive:
    - dw4_reference_v2_shared_fm_seed0_am_seeds_1_2_3
  corrected_conditional_negative:
    - lj13_reference_v2_shared_fm_seed0_am_seeds_1_2_3
  single_seed_mixed_diagnostic:
    - ala2_fair10k

corrected_results:
  root: results/corrected
  manifest: results/corrected/MANIFEST.json
  checksums: results/corrected/SHA256SUMS
  provenance: results/corrected/PROVENANCE.json

payload_policy:
  model_checkpoints_included: false
  sample_arrays_included: false
  forbidden_extensions:
    - .ckpt
    - .npy
    - .npz
    - .pkl
    - .pt
    - .pth
    - .safetensors
  retained_provenance:
    - checkpoint SHA-256 values
    - source sample/reference SHA-256 values
    - training and evaluation configurations
    - exact scripts and code snapshots

superseded_v0_1:
  immutable_tag: v0.1.0
  commit: 57f6a2c17c00276e5604ecad2933c4a7c06683ac
  systems:
    - mb2d
    - dw4
    - lj13
  reason: >
    The original result records were tied to rejected finite-time ULA/biased
    references and are historical only.

verification:
  corrected_export: cd results/corrected && sha256sum -c SHA256SUMS
  tests: pytest
