schema_version: 2
release: v0.2.0
note: >
  This index points to the checkpoint-free corrected result records. Exact
  source configurations and scripts live inside each corrected result bundle.

runs:
  dw1d_legacy:
    result_status: accepted_hash_bound_legacy
    source_tag: v0.1.0
    claim_limit: Anchor arrays contain only 16 samples and provenance is incomplete.

  dw2d_legacy:
    result_status: accepted_hash_bound_legacy
    source_tag: v0.1.0
    claim_limit: Generation provenance is incomplete.

  mb2d_reference_v2_seed0:
    result_status: corrected_single_seed_positive_pilot
    problem: mb2d
    beta0: 1.0
    beta1: 1.2
    model_seed: 0
    config: results/corrected/mb2d/seed0_run/config.yaml
    exact_script: results/corrected/mb2d/seed0_run/exact_run_script.sh
    metrics: results/corrected/mb2d/SUMMARY.json
    figures: results/corrected/mb2d/seed0_run/publication_figures

  dw4_reference_v2:
    result_status: corrected_conditional_positive
    problem: dw4
    beta0: 0.8
    beta1: 1.0
    shared_fm_seed: 0
    am_seeds: [1, 2, 3]
    representative_config: results/corrected/dw4/formal_seed2_run/config.yaml
    aggregate: results/corrected/dw4/aggregate/aggregate_metrics.json
    figures: results/corrected/dw4/aggregate/figures
    claim_limit: Three AM seeds conditional on one shared FM controller.

  lj13_reference_v2:
    result_status: corrected_conditional_negative
    problem: lj13
    beta0: 0.8
    beta1: 1.0
    shared_fm_seed: 0
    am_seeds: [1, 2, 3]
    representative_config: results/corrected/lj13/runs/am_seed2/config.yaml
    aggregate: results/corrected/lj13/runs/am_seed2/aggregate_lj13_reference_v2_am_seeds/aggregate_metrics.json
    figures: results/corrected/lj13/plots
    claim_limit: Three AM seeds conditional on one shared FM controller.

  ala2_fair10k:
    result_status: single_seed_mixed_diagnostic
    problem: ala2
    protocol: Same canonical MD array and fixed 10k indices; no filtering.
    metrics: results/corrected/ala2/comparison_metrics.json
    configs: results/corrected/ala2/raw_metrics_and_configs
    figures: results/corrected/ala2/plots/figures
    claim_limit: No symmetry-aware geometric W2 and no multi-seed claim.
