schema_version: 1
metric_protocol:
  primary:
    energy: energy_w2_2k
    geometry: geometric_w2_2k
  metric_samples: 2000
  note: Larger generated sets are evaluated through repeated fixed-size subsampling.

runs:
  dw1d_0p25_to_0p70:
    result_status: positive
    reproduction_profile: dw1d_best
    problem: dw1d
    model: {type: mlp, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8}
    beta_grid: [0.25, 1.50]
    beta0: 0.25
    beta1: 0.70
    fm_steps: 30000
    am_steps: 10000
    am_parameterization: target-refinement
    checkpoint_dir: checkpoints/dw1d/0p25_to_0p70
    source_run: outputs/dw1d/dw1d_anchor_0.25_target_0.70_am10k_two_anchor_fm_gpu0
    provenance: reconstructed_from_checkpoint_shape_history_and_legacy_defaults

  dw2d_0p25_to_0p70:
    result_status: positive
    reproduction_profile: dw2d_best
    problem: dw2d
    model: {type: mlp, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8}
    beta_grid: [0.25, 1.50]
    beta0: 0.25
    beta1: 0.70
    fm_steps: 30000
    am_steps: 10000
    am_parameterization: target-refinement
    checkpoint_dir: checkpoints/dw2d/0p25_to_0p70
    source_run: outputs/dw2d/dw2d_anchor_0.25_target_0.70_am10k_two_anchor_fm_gpu0
    provenance: reconstructed_from_checkpoint_shape_history_and_legacy_defaults

  mb2d_multianchor:
    result_status: mixed
    reproduction_profiles: [mb2d_0p25_to_0p30, mb2d_0p50_to_0p60, mb2d_0p75_to_0p90, mb2d_1p00_to_1p20]
    problem: mb2d
    model: {type: mlp, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8}
    beta_grid: [0.25, 0.50, 0.75, 1.00, 1.50]
    fm_steps: 30000
    am_steps: 10000
    am_parameterization: target-refinement
    transfers:
      - {beta0: 0.25, beta1: 0.30, checkpoint_dir: checkpoints/mb2d/0p25_to_0p30}
      - {beta0: 0.50, beta1: 0.60, checkpoint_dir: checkpoints/mb2d/0p50_to_0p60}
      - {beta0: 0.75, beta1: 0.90, checkpoint_dir: checkpoints/mb2d/0p75_to_0p90}
      - {beta0: 1.00, beta1: 1.20, checkpoint_dir: checkpoints/mb2d/1p00_to_1p20}
    source_run_prefix: outputs/mb2d/mb2d_anchor_
    provenance: reconstructed_from_checkpoint_shape_history_and_legacy_defaults

  dw4_paper:
    result_status: positive
    reproduction_profile: dw4_best_formal_seed2
    problem: dw4
    data_name: dw4_paper
    model: {type: egnn, hidden_dim: 128, n_layers: 5, t_embed_dim: 16, beta_embed_dim: 8}
    beta_grid: [0.80, 1.20]
    beta0: 0.80
    beta1: 1.00
    fm: {steps: 100000, batch_size: 512, lr: 3.0e-4}
    am: {steps: 1000, batch_size: 512, lr: 5.0e-7, lr_min: 5.0e-9, grad_clip: 1.0, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, parameterization: target-refinement}
    sampling: {ode_steps: 150, method: euler, n_eval: 12000}
    checkpoint_dir: checkpoints/dw4/0p8_1p2_to_1p0
    formal_checkpoints: [am_seed1.pkl, am_seed2.pkl, am_seed3.pkl]
    representative_checkpoint: am_seed2.pkl
    note: The representative checkpoint minimizes formal-run energy W2. Aggregate claims use all three formal seeds; the exploratory scan-selected checkpoint is excluded from v0.1.0.

  lj13_paper:
    result_status: mixed
    reproduction_profile: lj13_best
    problem: lj13
    data_name: lj13_paper
    model: {type: painn, hidden_dim: 128, n_layers: 5, t_embed_dim: 16, beta_embed_dim: 8}
    beta_grid: [0.80, 1.20]
    beta0: 0.80
    beta1: 1.00
    fm: {steps: 100000, batch_size: 64, lr: 3.0e-4}
    am: {steps: 1000, batch_size: 64, lr: 5.0e-7, lr_min: 5.0e-9, grad_clip: 0.0, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, parameterization: target-refinement}
    sampling: {ode_steps: 150, method: euler, n_eval: 12000}
    checkpoint_dir: checkpoints/lj13/0p8_1p2_to_1p0
    evaluation_seeds: [101, 202, 303]
    note: The three evaluation seeds use the same FM and AM checkpoint.

  ala2_experimental:
    result_status: experimental_failed_case
    reproduction_profile: ala2_fm_baseline
    problem: ala2
    model: {type: ala2_chiro_painn_jax, hidden_dim: 128, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8, atom_embed_dim: 16}
    temperatures_kelvin: [300, 500, 700, 900]
    beta_grid: [0.40090785014242014, 0.24054471008545208, 0.1718176500610372, 0.13363595004747336]
    fm: {steps: 30000, batch_size: 256, samples_per_beta: 125000, lr: 0.001, lr_min: 0.001, prior_scale: 0.15, grad_clip: 0.5}
    checkpoint_dir: checkpoints/ala2/grid3579_125k_t800
    status: experimental_failed_case_checkpoints_released
    am_parameterization: target-refinement
    checkpoint_sets:
      - {name: grid35_t400, base_layers: 5, anchor_temperatures_kelvin: [300, 500], target_temperature_kelvin: 400, directory: checkpoints/ala2/grid35_t400}
      - {name: grid3579_t400, base_layers: 5, anchor_temperatures_kelvin: [300, 500, 700, 900], target_temperature_kelvin: 400, directory: checkpoints/ala2/grid3579_t400}
      - {name: grid3579_t600, base_layers: 5, anchor_temperatures_kelvin: [300, 500, 700, 900], target_temperature_kelvin: 600, directory: checkpoints/ala2/grid3579_t600}
      - {name: grid3579_125k_t800, base_layers: 3, anchor_temperatures_kelvin: [300, 500, 700, 900], target_temperature_kelvin: 800, directory: checkpoints/ala2/grid3579_125k_t800}
    note: These checkpoints preserve representative Ala2 attempts and are excluded from successful-result comparisons.
