schema_version: 1
notes:
  - Profiles reproduce the recorded training setup; accelerator kernels need not be bitwise deterministic.
  - exact means a saved ADTM config and final checkpoint provenance are available.
  - reconstructed means some AM arguments came from the legacy CLI defaults because that run did not save a separate AM config.

profiles:
  dw1d_best:
    status: reconstructed
    problem: dw1d
    model: mlp
    data_dir: data/dw1d
    fm: {beta_grid: [0.25, 1.5], steps: 30000, batch_size: 512, lr: 0.001, lr_min: 0.00001, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8, prior_scale: 1.0, grad_clip: 1.0, seed: 0}
    am: {beta0: 0.25, beta1: 0.70, steps: 10000, batch_size: 512, lr: 0.00002, lr_min: 0.0000002, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, max_sigma: 50.0, energy_grad_scale: 1.0, grad_clip: 1.0, am_parameterization: target-refinement, seed: 0}
    sampling: {beta: 0.70, ode_steps: 300, method: euler, prior_scale: 1.0}

  dw2d_best:
    status: reconstructed
    problem: dw2d
    model: mlp
    data_dir: data/dw2d
    fm: {beta_grid: [0.25, 1.5], steps: 30000, batch_size: 512, lr: 0.001, lr_min: 0.00001, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8, prior_scale: 1.0, grad_clip: 1.0, seed: 0}
    am: {beta0: 0.25, beta1: 0.70, steps: 10000, batch_size: 512, lr: 0.00002, lr_min: 0.0000002, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, max_sigma: 50.0, energy_grad_scale: 1.0, grad_clip: 1.0, am_parameterization: target-refinement, seed: 0}
    sampling: {beta: 0.70, ode_steps: 300, method: euler, prior_scale: 1.0}

  mb2d_0p25_to_0p30:
    status: reconstructed
    problem: mb2d
    model: mlp
    data_dir: data/mb2d
    fm: &mb2d_fm {beta_grid: [0.25, 0.5, 0.75, 1.0, 1.5], steps: 30000, batch_size: 512, lr: 0.001, lr_min: 0.00001, hidden_dim: 512, n_layers: 3, t_embed_dim: 16, beta_embed_dim: 8, prior_scale: 1.0, grad_clip: 1.0, seed: 0}
    am: {beta0: 0.25, beta1: 0.30, steps: 10000, batch_size: 512, lr: 0.00002, lr_min: 0.0000002, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, max_sigma: 50.0, energy_grad_scale: 1.0, grad_clip: 1.0, am_parameterization: target-refinement, seed: 0}
