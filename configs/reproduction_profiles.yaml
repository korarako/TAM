    status: reconstructed
    problem: mb2d
    model: mlp
    data_dir: data/mb2d
    fm: *mb2d_fm
    am: {beta0: 0.50, beta1: 0.60, steps: 10000, batch_size: 512, lr: 0.00002, lr_min: 0.0000002, sde_steps: 40, loss_steps: 20, keep_last_steps: 10, max_sigma: 50.0, energy_grad_scale: 1.0, grad_clip: 1.0, am_parameterization: target-refinement, seed: 0}
